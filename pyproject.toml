[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneldarwin"
version = "0.2.0"
description = "Evidence-first GPU performance investigations with falsifiable hypotheses and reproducible experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Nazeeh Abdul-Hadi"}]
keywords = ["cuda", "triton", "performance", "profiling"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
cuda = ["torch>=2.5,<3", "triton>=3.1,<4; platform_system == 'Linux'"]
control = ["numpy>=1.26,<3"]

[project.scripts]
kerneldarwin = "kerneldarwin.cli:main"
kd = "kerneldarwin.cli:main"

[project.urls]
Homepage = "https://github.com/nazeeh111/KERNELDARWIN"
Documentation = "https://github.com/nazeeh111/KERNELDARWIN/tree/main/docs"
Issues = "https://github.com/nazeeh111/KERNELDARWIN/issues"

[tool.setuptools]
packages = ["kerneldarwin", "kerneldarwin.lab"]
package-dir = {"kerneldarwin" = "src/kerneldarwin", "kerneldarwin.lab" = "lab"}

[tool.setuptools.package-data]
"kerneldarwin.lab" = ["*.html", "*.css", "*.js", "*.svg", "data/*.json", "js/*.js", "assets/fonts/*.woff2", "assets/fonts/OFL.txt", "package.json"]
