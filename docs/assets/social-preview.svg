<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">KERNELDARWIN</title><desc id="d">An evidence-first performance investigation laboratory. Research preview with CPU controls; GPU validation pending.</desc><rect width="1280" height="640" fill="#f5f3ec"/><path d="M0 0h1280v14H0z" fill="#be412a"/><g font-family="Arial,Helvetica,sans-serif"><rect x="66" y="62" width="62" height="62" rx="2" fill="#c63f27"/><path d="M81 76v34m12-34v34m2-17 20-17h-13m-7 17 20 17h-13" stroke="#fffefa" stroke-width="3" fill="none"/><text x="148" y="87" font-size="23" font-weight="700" fill="#252923">KERNELDARWIN</text><text x="149" y="112" font-size="12" letter-spacing="2" fill="#555e50">PERFORMANCE LABORATORY</text><text x="66" y="242" font-size="67" letter-spacing="-2.8" font-weight="700" fill="#252923">Evidence before</text><text x="66" y="318" font-size="67" letter-spacing="-2.8" font-weight="700" fill="#252923">optimization.</text><text x="69" y="369" font-size="23" fill="#555e50">Why is this workload slow? Keep the experiment that answers it.</text><g font-size="14" font-weight="700" fill="#252923"><rect x="67" y="421" width="340" height="72" fill="#fffefa" stroke="#c9cabe"/><text x="88" y="450" fill="#b83d26">01 / QUESTION</text><text x="88" y="477">Evidence + a falsifier</text><rect x="426" y="421" width="340" height="72" fill="#fffefa" stroke="#c9cabe"/><text x="447" y="450" fill="#b83d26">02 / EXPERIMENT</text><text x="447" y="477">Keep every attempted change</text><rect x="785" y="421" width="427" height="72" fill="#fffefa" stroke="#c9cabe"/><text x="806" y="450" fill="#b83d26">03 / VERIFY</text><text x="806" y="477">Numerical checks + repeatable measurements</text></g><line x1="67" y1="542" x2="1212" y2="542" stroke="#c9cabe"/><text x="67" y="577" font-size="14" fill="#b83d26">RESEARCH PREVIEW · CPU CONTROLS · GPU VALIDATION PENDING</text><text x="1212" y="577" text-anchor="end" font-size="14" fill="#555e50">github.com/nazeeh111/KERNELDARWIN</text></g></svg>
