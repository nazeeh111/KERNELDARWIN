<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" role="img" aria-labelledby="title desc"><title id="title">CPU held-out selection comparison</title><desc id="desc">The learned model and fixed heuristic have the same mean log-speedup. All marks derive from recorded CPU replay. This does not establish GPU performance.</desc><rect width="100%" height="100%" fill="#f5f3ec"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="48" font-size="15" fill="#b83d26" font-weight="700" text-anchor="start">MEASURED CPU CONTROL / OFFLINE REPLAY</text><text x="44" y="92" font-size="35" fill="#252923" font-weight="700" text-anchor="start">Learning matched the simple rule.</text><text x="44" y="126" font-size="16" fill="#50564c" font-weight="400" text-anchor="start">Leave-one-family-out · 24 workloads · one candidate per task · higher log-speedup is better</text><text x="250" y="196" font-size="16" fill="#252923" font-weight="400" text-anchor="end">Learned UCB</text><rect id="bar-learned_ucb" x="270" y="174" width="568.0625" height="29" fill="#bd422a"/><text x="850.0625125142849" y="195" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.3071</text><text x="250" y="243" font-size="16" fill="#252923" font-weight="400" text-anchor="end">Fixed heuristic</text><rect id="bar-heuristic" x="270" y="221" width="568.0625" height="29" fill="#596451"/><text x="850.0625125142849" y="242" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.3071</text><text x="250" y="290" font-size="16" fill="#252923" font-weight="400" text-anchor="end">Random (32 orders)</text><rect id="bar-random" x="270" y="268" width="491.0215" height="29" fill="#596451"/><text x="773.021458084386" y="289" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.2654</text><text x="250" y="337" font-size="16" fill="#252923" font-weight="400" text-anchor="end">GP-UCB (32 starts)</text><rect id="bar-bayesian_ucb" x="270" y="315" width="494.9066" height="29" fill="#596451"/><text x="776.906592754988" y="336" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.2675</text><text x="250" y="384" font-size="16" fill="#252923" font-weight="400" text-anchor="end">No context</text><rect id="bar-no_context" x="270" y="362" width="568.0625" height="29" fill="#596451"/><text x="850.0625125142849" y="383" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.3071</text><text x="250" y="431" font-size="16" fill="#252923" font-weight="400" text-anchor="end">No uncertainty</text><rect id="bar-no_uncertainty" x="270" y="409" width="568.0625" height="29" fill="#596451"/><text x="850.0625125142849" y="430" font-size="16" fill="#252923" font-weight="400" text-anchor="start">0.3071</text><text x="270.0" y="490" font-size="14" fill="#50564c" font-weight="400" text-anchor="middle">0.0</text><text x="455.0" y="490" font-size="14" fill="#50564c" font-weight="400" text-anchor="middle">0.1</text><text x="640.0" y="490" font-size="14" fill="#50564c" font-weight="400" text-anchor="middle">0.2</text><text x="825.0" y="490" font-size="14" fill="#50564c" font-weight="400" text-anchor="middle">0.3</text><text x="1010.0" y="490" font-size="14" fill="#50564c" font-weight="400" text-anchor="middle">0.4</text><text x="640.0" y="520" font-size="16" fill="#252923" font-weight="400" text-anchor="middle">Mean best observed log(speedup)</text><text x="44" y="563" font-size="15" fill="#b83d26" font-weight="400" text-anchor="start">Three CPU row-batch choices are a weak test. No GPU selection benefit or causal finding is established.</text></g></svg>
