<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 475" role="img" aria-labelledby="title desc"><title id="title">KERNELDARWIN experiment workflow</title><desc id="desc">Six implementation stages and a feedback loop preserve failures and improve future experiment selection. Causal diagnosis and GPU learning remain unvalidated.</desc><rect width="100%" height="100%" fill="#f5f3ec"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="52" font-size="16" fill="#b83d26" font-weight="700" text-anchor="start">KERNELDARWIN / THE EVIDENCE LOOP</text><text x="44" y="98" font-size="38" fill="#252923" font-weight="700" text-anchor="start">An improvement earns its status.</text><g id="phase-0"><rect x="44" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="60" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">01</text><text x="60" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">PROFILE</text><text x="60" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Shape · dtype · baseline</text></g><path d="M248 207h16m-5-5 5 5-5 5" fill="none" stroke="#70786d" stroke-width="2"/><g id="phase-1"><rect x="266" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="282" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">02</text><text x="282" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">HYPOTHESIZE</text><text x="282" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Evidence + falsifier</text></g><path d="M470 207h16m-5-5 5 5-5 5" fill="none" stroke="#70786d" stroke-width="2"/><g id="phase-2"><rect x="488" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="504" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">03</text><text x="504" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">EXPERIMENT</text><text x="504" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Bounded configurations</text></g><path d="M692 207h16m-5-5 5 5-5 5" fill="none" stroke="#70786d" stroke-width="2"/><g id="phase-3"><rect x="710" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="726" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">04</text><text x="726" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">VERIFY</text><text x="726" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Reference + uncertainty</text></g><path d="M914 207h16m-5-5 5 5-5 5" fill="none" stroke="#70786d" stroke-width="2"/><g id="phase-4"><rect x="932" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="948" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">05</text><text x="948" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">CONFIRM</text><text x="948" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Fresh input + timing</text></g><path d="M1136 207h16m-5-5 5 5-5 5" fill="none" stroke="#70786d" stroke-width="2"/><g id="phase-5"><rect x="1154" y="140" width="202" height="134" fill="#fffefa" stroke="#c9cabe"/><text x="1170" y="169" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">06</text><text x="1170" y="204" font-size="19" fill="#252923" font-weight="700" text-anchor="start">LEARN</text><text x="1170" y="236" font-size="13" fill="#50564c" font-weight="400" text-anchor="start">Grouped recorded replay</text></g><path id="feedback-loop" d="M1250 282v35H358v-35m-5 5 5-5 5 5" fill="none" stroke="#b83d26" stroke-width="2"/><text x="805" y="341" font-size="15" fill="#b83d26" font-weight="400" text-anchor="middle">Preserve failures. Update the next experiment.</text><line x1="44" y1="375" x2="1356" y2="375" stroke="#c9cabe"/><text x="44" y="407" font-size="13" fill="#38634a" font-weight="700" text-anchor="start">IMPLEMENTED</text><text x="190" y="407" font-size="16" fill="#252923" font-weight="400" text-anchor="start">Authored templates, numerical checks, paired timing, confirmation, storage, offline selector.</text><text x="44" y="442" font-size="13" fill="#b83d26" font-weight="700" text-anchor="start">RESEARCH OPEN</text><text x="190" y="442" font-size="16" fill="#252923" font-weight="400" text-anchor="start">Causal diagnosis, learned GPU advantage, hardware transfer and NVIDIA validation.</text></g></svg>
