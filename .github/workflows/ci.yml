name: CPU contracts and distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[control]'
      - run: python -m unittest discover -s tests -v
      - run: kd doctor
      - run: kd control --family softmax --shape 32 31 --repeats 20
      - run: python scripts/check_evidence.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python-${{ matrix.python }}
          path: dist/*.whl
