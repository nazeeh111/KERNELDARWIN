name: CPU contracts and distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[control]'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/frontend/*.test.mjs
      - run: kd doctor
      - run: kd control --family softmax --shape 32 31 --repeats 20
      - run: python scripts/check_evidence.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/check_lab_package.py dist/*.whl
      - run: python scripts/check_workload_package.py dist/*.whl
      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          kd doctor
          python -c "from importlib.resources import files; assert (files('kerneldarwin.lab') / 'js/commands.js').is_file(); assert (files('kerneldarwin.lab') / 'refinement.css').is_file()"
      - name: Build source archive
        if: matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python-${{ matrix.python }}
          path: dist/
