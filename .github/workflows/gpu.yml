name: Explicit self-hosted CUDA validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, linux, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install '.[cuda]'
      - run: kd doctor
      - run: python scripts/sanitizer_check.py
      - run: compute-sanitizer --tool memcheck --error-exitcode 86 python scripts/sanitizer_check.py
      - run: kd investigate --family softmax --shape 128 1024 --trace --store .runs --wall-seconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-evidence
          path: .runs/
# Requires an explicitly provisioned trusted NVIDIA runner. Never auto-runs on PRs.
# No runner is supplied or paid for by this repository.
